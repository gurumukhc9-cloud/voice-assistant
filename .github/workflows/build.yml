name: Build APK

on:
  push:
    paths:
      - 'bundle/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack bundle
        run: |
          python3 - <<'PY'
          import glob, os
          root = 'proj'
          data = {}
          cur = None
          for f in sorted(glob.glob('bundle/*.txt')):
              text = open(f, encoding='utf-8').read()
              for line in text.split('\n'):
                  s = line.rstrip()
                  if s.startswith('=== FILE: ') and s.endswith(' ==='):
                      cur = s[10:-4].strip()
                      data[cur] = []
                  elif cur is not None:
                      data[cur].append(line)
          for p, lines in data.items():
              fp = os.path.join(root, p)
              os.makedirs(os.path.dirname(fp) or '.', exist_ok=True)
              with open(fp, 'w', encoding='utf-8') as o:
                  o.write('\n'.join(lines).rstrip('\n') + '\n')
          print(len(data), 'files written')
          PY

      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: proj/app/build/outputs/apk/debug/app-debug.apk
